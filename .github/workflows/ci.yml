name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

# Cancel in-flight runs on the same ref (saves minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Windows runners default to core.autocrlf=true, so actions/checkout
      # rewrites every text file's line endings and `gofmt -l .` then lists
      # the entire tree. The Windows job failed at "Verify formatting" and
      # never reached "Test", which silently made the native Windows
      # acceptance rows (AVP-176, AVP-199) unrun. Checking out with LF is
      # what makes windows-latest execute meaningful assertions.
      - name: Check out with LF line endings on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          # GH #23's pre-change provenance guard verifies which accepted
          # prepare-check commits introduced the frozen routing goldens.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Reads the version from go.mod so CI matches local dev.
          go-version-file: go.mod
          # Module + build cache is enabled by default.
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # ubuntu-latest and macos-latest gate on the whole repository: the full
      # suite is blocking there and always has been. S7 AR runs in smaller
      # fresh processes so recursive analyzer fixtures release package-local
      # caches between groups, while complementary regexes retain complete
      # non-overlapping coverage.
      - name: Test
        if: runner.os != 'Windows'
        shell: bash
        env:
          BASH_ENV: /dev/null
          GOFLAGS: ""
          GOENV: "off"
        run: |
          set -euo pipefail
          go test ./... -count=1 -timeout 40m -skip '^(TestS7AR.*|TestS7Observed(AMThroughAO|AP|AQ|AR(Core|Purge|Claims)|AS)RegistrationAuthority)$'
          go test ./internal/cli -count=1 -timeout 40m -run '^TestS7ARRev(11|12|13|14|15).*$'
          go test ./internal/cli -count=1 -timeout 40m -run '^TestS7ARRev(16|17|18).*$'
          go test ./internal/cli -count=1 -timeout 40m -run '^TestS7ARRev(19|20).*$'
          go test ./internal/cli -count=1 -timeout 40m -run '^TestS7ARRev(21|23|24).*$'
          go test ./internal/cli -count=1 -timeout 40m -run '^TestS7ARRev(25|26|27).*$'
          go test ./internal/cli -count=1 -timeout 40m -run '^TestS7AR(ExitSixRouteGuard|PrepareGrammarGuard|DivergenceContracts|AbandonContracts|ArchiveControlContracts|CoverageLedger|CoverageLedgerRejectsEmptyTarget)$'
          go test ./internal/cli -count=1 -timeout 40m -run '^TestS7ARAbandonGateTableGuard$'
          go test ./internal/cli -count=1 -timeout 40m -run '^TestS7ARPurgeProgressGuard$'
          go test ./internal/cli -count=1 -timeout 40m -run '^TestS7ARPermanentBlockClaimsGuard$'

      - name: Cross-compile S7 BSD CLI rows
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for goos in freebsd openbsd netbsd dragonfly; do
            binary="${RUNNER_TEMP}/cli-${goos}.test"
            GOOS="${goos}" GOARCH=amd64 CGO_ENABLED=0 go test -c -o "$binary" ./internal/cli
            test -s "$binary"
            rm -f "$binary"
          done

      # windows-latest gates on the GH #16 surface only, and that gate is
      # BLOCKING. The native rows (AVP-176, AVP-199) can only be proven on a
      # real Windows runner, so this step runs them verbosely and then asserts
      # the verbose log actually contains their PASS lines: `go test -run` on a
      # pattern that matches nothing exits 0, which would make a silent
      # regression look like a green gate.
      #
      # The package list is exactly the set that is empirically green on
      # windows-latest (run 32093250847). AVP-175 pins that set exactly — not
      # as a lower bound — together with the native invocation, the per-row
      # loop and the leaf floor, so a package cannot be dropped from here or
      # moved into the allowed-failure step below.
      - name: "Test (Windows GH #16 surface — blocking)"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/native-windows.log"
          go test -v -count=1 -run TestAVPNativeWindows ./internal/intent 2>&1 | tee "$log"
          for row in AVP-176 AVP-199; do
            if ! grep -q -- "--- PASS: TestAVPNativeWindows/${row}" "$log"; then
              echo "::error::TestAVPNativeWindows/${row} did not execute on this runner"
              exit 1
            fi
          done
          leaves=$(grep -E -c -- "--- PASS: TestAVPNativeWindows/[A-Z0-9-]+/[a-z0-9-]+" "$log" || true)
          if [ "${leaves:-0}" -lt 6 ]; then
            echo "::error::only ${leaves:-0} native Windows leaf assertions executed; expected at least 6"
            exit 1
          fi
          go test -count=1 \
            ./internal/intent \
            ./assets \
            ./internal/buildinfo \
            ./internal/redact \
            ./internal/safety \
            ./internal/testutil \
            ./internal/tools/studyvalidator \
            ./tests/integration

      - name: "Test (Windows GH #23 resource golden — blocking)"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/prepare-resource-golden.log"
          go test -v -count=1 \
            -run '^TestPreparePIBUnsupportedPlatformRuntimeGolden$' \
            ./internal/cli 2>&1 | tee "$log"
          if ! grep -q -- "--- PASS: TestPreparePIBUnsupportedPlatformRuntimeGolden" "$log"; then
            echo "::error::TestPreparePIBUnsupportedPlatformRuntimeGolden did not execute on this runner"
            exit 1
          fi
          s7_log="${RUNNER_TEMP}/prepare-s7-windows.log"
          go test -v -count=1 \
            -run '^TestS7WindowsPlatformRows$' \
            ./internal/cli 2>&1 | tee "$s7_log"
          if ! grep -q -- "--- PASS: TestS7WindowsPlatformRows" "$s7_log"; then
            echo "::error::TestS7WindowsPlatformRows did not execute on this runner"
            exit 1
          fi
          for selector in \
            TestS7WindowsPlatformRows/PIB-409 \
            TestS7WindowsPlatformRows/PIB-417 \
            TestS7WindowsPlatformRows/PIB-417/check-ready-human.txt \
            TestS7WindowsPlatformRows/PIB-417/check-ready-json.txt; do
            if ! grep -q -- "--- PASS: ${selector}" "$s7_log"; then
              echo "::error::${selector} did not execute on this runner"
              exit 1
            fi
          done
          ap_log="${RUNNER_TEMP}/prepare-s7-ap-windows.log"
          go test -v -count=1 \
            -run '^TestS7APDryRunWindowsNotEvaluatedPlatform$' \
            ./internal/cli 2>&1 | tee "$ap_log"
          for selector in \
            TestS7APDryRunWindowsNotEvaluatedPlatform \
            TestS7APDryRunWindowsNotEvaluatedPlatform/PIB-463; do
            if ! grep -q -- "--- PASS: ${selector}" "$ap_log"; then
              echo "::error::${selector} did not execute on this runner"
              exit 1
            fi
          done

      # The rest of the repository has 200 pre-existing windows-latest
      # top-level test failures (283 counting subtests) across six packages —
      # internal/cli, internal/gitutil, internal/provider, internal/rescap,
      # internal/store and internal/workflow (run 32093250847). At `-timeout
      # 20m` no package times out, so the suite runs to completion and the
      # whole inventory is reported rather than truncated by an early abort.
      # These failures were invisible until GH #16 made the Windows job reach
      # `go test` at all. They are owned and tracked by
      # https://github.com/tesseracode/tesserapatch/issues/17 (GH #17), which
      # also owns deleting this step: when the suite is green on Windows this
      # step and the blocking step above collapse back into one blocking
      # `go test ./...`.
      #
      # Until then the failures are visible ONLY in this step's log output.
      # `continue-on-error: true` maps the step's *conclusion* to `success`,
      # so the step conclusion, the job conclusion and the run summary all
      # report success and a reader has to open the job log to see the
      # inventory. That is the accepted trade: the job stays green, so a
      # tagged release remains publishable, and the blocking step above is
      # what actually gates the GH #16 surface.
      - name: "Test (Windows full suite — allowed to fail, owned by GH #17)"
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: go test ./... -count=1 -timeout 20m

      - name: Install binary (smoke test)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          go install ./cmd/tpatch
          "$(go env GOPATH)/bin/tpatch" --version

      - name: Install binary (smoke test, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go install ./cmd/tpatch
          $gopath = (go env GOPATH)
          & "$gopath\bin\tpatch.exe" --version

      # On tag pushes, ensure the binary's --version output matches the
      # git tag. This catches missing ldflags wiring or stale embedded
      # versions before the release job publishes artifacts. Both non-Windows
      # legs verify it — pinning it to a single OS would let a macOS-specific
      # ldflags or `make install` regression reach a release unchecked. The
      # Windows leg is excluded because `make` is not installed on
      # windows-latest, not because the check is ubuntu-specific.
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          make install
          version_output="$("$(go env GOPATH)/bin/tpatch" --version)"
          expected="tpatch ${VERSION}"
          echo "version output: $version_output"
          echo "expected:       $expected"
          if [ "$version_output" != "$expected" ]; then
            echo "::error::tpatch --version output does not match tag ${VERSION}"
            exit 1
          fi

  s7-observers:
    name: S7 observers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test S7 observers
        shell: bash
        env:
          BASH_ENV: /dev/null
          GOFLAGS: ""
          GOENV: "off"
        run: |
          set -euo pipefail
          go test ./internal/cli -count=1 -timeout 40m -run '^TestS7ObservedARCoreRegistrationAuthority$'
          go test ./internal/cli -count=1 -timeout 40m -run '^TestS7ObservedARPurgeRegistrationAuthority$'
          go test ./internal/cli -count=1 -timeout 40m -run '^TestS7ObservedARClaimsRegistrationAuthority$'
          go test ./internal/cli -count=1 -timeout 40m -run '^TestS7ObservedAMThroughAORegistrationAuthority$'
          go test ./internal/cli -count=1 -timeout 40m -run '^TestS7ObservedAPRegistrationAuthority$'
          go test ./internal/cli -count=1 -timeout 40m -run '^TestS7ObservedAQRegistrationAuthority$'
          go test ./internal/cli -count=1 -timeout 40m -run '^TestS7ObservedASRegistrationAuthority$'

  # Publish a GitHub Release whenever a v* tag is pushed.
  # Release notes are generated from commits since the previous tag.
  release:
    name: release
    needs: [test, s7-observers]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
